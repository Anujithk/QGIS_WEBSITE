<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/kerala-gov-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kerala Grama Panchayat Directory | Government of Kerala LSGD</title>
    <meta
      name="description"
      content="Comprehensive citizen directory and information portal for Grama Panchayats across Kerala. Search 941 Panchayats across 14 districts, inspect administrative divisions, interactive OpenStreetMap locations, and civic services."
    />
    <meta name="theme-color" content="#0a0a0c" />

    <link rel="manifest" href="/manifest.json" />

    <!-- 3G / Low 4G Network Performance Optimizations -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preload" as="image" href="/kerala-gov-logo.png" fetchpriority="high" />
  </head>
  <body>
    <div id="root">
      <!-- Instant App Shell Skeleton: Sub-150ms First Contentful Paint on 3G -->
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff; min-height: 100vh; color: #141416;">
        <div style="background: #0a0a0c; color: #ffffff; padding: 10px 16px; border-bottom: 2px solid #27272a;">
          <div style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <img src="/kerala-gov-logo.png" alt="Kerala Emblem" style="height: 38px; width: auto;" />
              <div>
                <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.02em;">KERALA GRAMA PANCHAYAT DIRECTORY</div>
                <div style="font-size: 10px; color: #a1a1aa; font-weight: 500;">തദ്ദേശ സ്വയംഭരണ വകുപ്പ് · GOVERNMENT OF KERALA</div>
              </div>
            </div>
          </div>
        </div>
        <div style="background: #0a0a0c; color: #ffffff; padding: 48px 16px 56px; border-bottom: 1px solid #27272a; text-align: center;">
          <div style="max-width: 800px; margin: 0 auto;">
            <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #a1a1aa; margin-bottom: 8px;">LOCAL SELF GOVERNMENT DEPARTMENT · LSGD</div>
            <div style="font-size: 28px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.02em;">Discover Your Grama Panchayat</div>
            <div style="font-size: 14px; color: #d4d4d8; max-width: 600px; margin: 0 auto 24px; line-height: 1.5;">Loading Kerala local self-government institutions, administrative directories, and maps...</div>
            <div style="width: 32px; height: 32px; border: 3px solid #27272a; border-top-color: #ffffff; border-radius: 50%; margin: 0 auto; animation: init-spin 0.6s linear infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes init-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
